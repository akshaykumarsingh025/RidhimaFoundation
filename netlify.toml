# Netlify configuration for Ridhima Foundation

[build]
  # Static site. The build step only generates the Hindi page (hi/index.html)
  # from index.html + i18n/hi.json — plain Node, no npm install needed.
  command = "node scripts/build-hi.js"
  publish = "."

# Optimize caching for faster page loads
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Logo, favicon, QR and share images keep fixed names, so let browsers recheck daily
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'self'; manifest-src 'self'"

# Stylesheet, script and data names are not fingerprinted, so let browsers revalidate
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/donors.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Keep build inputs and raw source material out of search results
[[headers]]
  for = "/i18n/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# One canonical host: send www to ridhimafoundation.org
[[redirects]]
  from = "https://www.ridhimafoundation.org/*"
  to = "https://ridhimafoundation.org/:splat"
  status = 301
  force = true

# Short, shareable donation link: ridhimafoundation.org/donate
[[redirects]]
  from = "/donate"
  to = "/#donate"
  status = 301

[[redirects]]
  from = "/hi/donate"
  to = "/hi/#donate"
  status = 301
