# Checks Dr. Deepika's YouTube channel once a day. If there is a new video,
# it updates videos.json + index.html and pushes to main, which makes
# Netlify redeploy the site with the new video in the slider.
name: Update YouTube videos

on:
  schedule:
    - cron: "30 3 * * *" # every day at 09:00 IST
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh video list
        run: node scripts/build-videos.js

      - name: Commit if something changed
        run: |
          if git diff --quiet -- videos.json index.html; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json index.html
          git commit -m "Update YouTube videos"
          git push
